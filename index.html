<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KubaLabs</title>
  <style>
    :root {
      --bg-1: #0f172a;
      --bg-2: #1e293b;
      --accent: #38bdf8;
      --accent-2: #22d3ee;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --panel-bg: rgba(15, 23, 42, 0.68);
      --panel-border: rgba(148, 163, 184, 0.25);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Inter", "Segoe UI", Tahoma, sans-serif;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top right, #1d4ed8 0%, transparent 35%),
                  radial-gradient(circle at bottom left, #0ea5e9 0%, transparent 30%),
                  linear-gradient(145deg, var(--bg-1), var(--bg-2));
      color: var(--text);
      padding: 2rem;
    }

    .layout {
      width: min(980px, 100%);
      display: grid;
      grid-template-columns: 220px 1fr;
      gap: 1rem;
      align-items: stretch;
    }

    .sidebar {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 20px;
      backdrop-filter: blur(6px);
      box-shadow: 0 20px 40px rgba(2, 6, 23, 0.35);
      padding: 1.3rem;
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
      align-self: center;
    }

    .sidebar h2 {
      font-size: 1rem;
      color: var(--muted);
      margin-bottom: 0.2rem;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }

    .nav-btn {
      text-decoration: none;
      color: var(--text);
      padding: 0.8rem 0.9rem;
      border-radius: 12px;
      border: 1px solid rgba(148, 163, 184, 0.25);
      background: rgba(30, 41, 59, 0.55);
      font-weight: 600;
      transition: transform 0.2s ease, border-color 0.2s ease, background 0.2s ease;
    }

    .nav-btn:hover {
      transform: translateX(2px);
      border-color: rgba(56, 189, 248, 0.6);
      background: rgba(14, 165, 233, 0.2);
    }

    .card {
      width: 100%;
      background: rgba(15, 23, 42, 0.72);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 20px;
      padding: 2.5rem;
      backdrop-filter: blur(6px);
      box-shadow: 0 20px 40px rgba(2, 6, 23, 0.45);
    }

    .badge {
      display: inline-block;
      font-size: 0.85rem;
      color: var(--accent-2);
      border: 1px solid rgba(34, 211, 238, 0.4);
      padding: 0.35rem 0.75rem;
      border-radius: 999px;
      margin-bottom: 1rem;
      letter-spacing: 0.03em;
    }

    h1 {
      font-size: clamp(2rem, 5vw, 3.1rem);
      margin-bottom: 0.7rem;
      line-height: 1.1;
    }

    h1 span {
      color: var(--accent);
    }

    p {
      color: var(--muted);
      font-size: 1.08rem;
      line-height: 1.65;
      margin-bottom: 1.8rem;
      max-width: 62ch;
    }

    .actions {
      display: flex;
      gap: 0.9rem;
      flex-wrap: wrap;
    }

    .btn {
      text-decoration: none;
      padding: 0.8rem 1.15rem;
      border-radius: 12px;
      font-weight: 600;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .btn-primary {
      color: #082f49;
      background: linear-gradient(120deg, var(--accent), var(--accent-2));
      box-shadow: 0 8px 24px rgba(56, 189, 248, 0.35);
    }

    .btn-secondary {
      color: var(--text);
      border: 1px solid rgba(148, 163, 184, 0.4);
      background: rgba(30, 41, 59, 0.4);
    }

    .btn:hover {
      transform: translateY(-2px);
    }

    footer {
      margin-top: 1.6rem;
      font-size: 0.9rem;
      color: var(--muted);
      opacity: 0.8;
    }

    @media (max-width: 860px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .sidebar {
        flex-direction: row;
        flex-wrap: wrap;
        align-items: center;
      }

      .sidebar h2 {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar" aria-label="Boční menu">
      <h2>Menu</h2>
      <a class="nav-btn" href="#">Hry</a>
      <a class="nav-btn" href="#">Nástroje</a>
      <a class="nav-btn" href="#">Info</a>
    </aside>

    <main class="card">
      <div class="badge">Simple landing page</div>
      <h1>Vítej v <span>KubaLabs</span></h1>
      <p>
        Moderní minimalistický návrh úvodní stránky s tmavým gradientním pozadím,
        glassmorphism kartou a výraznými CTA tlačítky. Stránka je plně responzivní
        a připravená jako základ pro další rozšíření.
      </p>

      <div class="actions">
        <a class="btn btn-primary" href="#">Začít</a>
        <a class="btn btn-secondary" href="#">Zjistit více</a>
      </div>

      <footer>© 2026 KubaLabs</footer>
    </main>
  </div>
</body>
</html>
